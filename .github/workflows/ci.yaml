name: CI

on:
  workflow_dispatch: {}
  pull_request: {}
  release:
    types: [published]
  push:
    branches:
      - master

jobs:
  golang:
    uses: UNIwise/workflows/.github/workflows/golang.yaml@master
    secrets: inherit
    with:
      go-version: 1.27.3
      golangci-lint-version: v2.15.0
      platforms: linux/amd64,linux/arm64
